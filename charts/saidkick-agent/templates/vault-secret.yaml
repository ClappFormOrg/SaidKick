{{- if and .Values.secretStore.enabled .Values.vault.token }}
# Vault / OpenBao token used by ESO to pull deployment secrets.
#
# IMPORTANT — namespace-scoping:
#   This token must have read access ONLY to:
#     kv/data/deployments/*  (filtered to this cluster's deployments by policy)
#   It must NOT have cluster-wide or platform-wide read access.
#   See API/RUNBOOK.md § "OpenBao — production setup" for the policy definition.
#
# Future: the agent will obtain per-cluster AppRole credentials during
# the handshake (replacing this static token). Track: post-Sprint 3.
apiVersion: v1
kind: Secret
metadata:
  name: saidkick-vault-credentials
  namespace: {{ include "saidkick-agent.secretStoreNamespace" . }}
  labels:
    {{- include "saidkick-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  token: {{ .Values.vault.token | quote }}
{{- if .Values.vault.caBundle }}
  ca.crt: {{ .Values.vault.caBundle | quote }}
{{- end }}
{{- end }}
