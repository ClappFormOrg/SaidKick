# Holds bootstrap credentials and cert material for the sAId-Kick agent.
#
# Lifecycle:
#   1. Helm install populates JOIN_TOKEN + CLUSTER_ID + HUB_URL + Argo CD creds.
#   2. Operator calls POST /api/v1/clusters/:id/handshake (via Bruno or curl)
#      and writes the returned PEM material into this Secret manually, or via
#      a future init-container that calls the handshake endpoint.
#   3. Agent reads cert files from /var/run/saidkick/ (mounted below) and
#      uses mTLS for all subsequent hub communication.
#   4. On upgrade, helm.sh/resource-policy: keep preserves the cert material
#      so the agent does not lose its identity.
#
# Security: JOIN_TOKEN is single-use (JTI burned on first handshake). If the
# Secret is compromised before handshake, revoke by deleting + re-registering
# the cluster on the hub.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "saidkick-agent.fullname" . }}-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saidkick-agent.labels" . | nindent 4 }}
  annotations:
    # Keep across helm upgrades so the agent retains its cert material.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Bootstrap values — required at install time.
  HUB_URL:    {{ required "agent.hubUrl is required" .Values.agent.hubUrl | quote }}
  CLUSTER_ID: {{ required "agent.clusterID is required" .Values.agent.clusterID | quote }}
  JOIN_TOKEN: {{ .Values.agent.joinToken | default "" | quote }}

  # Argo CD credentials — required for the agent to manage local applications.
  ARGOCD_SERVER_URL: {{ required "agent.argocd.serverUrl is required" .Values.agent.argocd.serverUrl | quote }}
  ARGOCD_AUTH_TOKEN: {{ required "agent.argocd.authToken is required" .Values.agent.argocd.authToken | quote }}

  # mTLS cert material — populated by the operator after the handshake.
  # Leave empty at first install; agent falls back to devMode if devMode=true.
  tls.crt: ""
  tls.key: ""
  ca.crt:  ""
