{{- if and (index .Values "external-dns" "enabled") .Values.externalDnsCredentials }}
{{- if gt (len .Values.externalDnsCredentials) 0 }}
# Secret containing provider credentials for token-based ExternalDNS providers
# (Scaleway, Cloudflare, etc.). Referenced via external-dns.envFrom in values.
# For IRSA / Workload Identity (AWS, AKS), leave externalDnsCredentials empty
# and set external-dns.serviceAccount.annotations instead.
apiVersion: v1
kind: Secret
metadata:
  name: externaldns-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saidkick-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $value := .Values.externalDnsCredentials }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
