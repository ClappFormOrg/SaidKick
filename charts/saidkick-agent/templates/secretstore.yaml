{{- if .Values.secretStore.enabled }}
{{- /*
ESO is a spoke prerequisite, not a subchart: a CRD and a resource of that
kind cannot land in the same release. Fail before Helm sends anything when
the cluster does not serve the SecretStore API. helm template needs
--api-versions external-secrets.io/v1/SecretStore to render this file; helm
lint (which has no such flag) runs with secretStore.enabled=false.
*/}}
{{- if not (.Capabilities.APIVersions.Has "external-secrets.io/v1/SecretStore") }}
{{- fail "External Secrets Operator is not installed: install it first (see README) or set secretStore.enabled=false" }}
{{- end }}
# Namespace-scoped SecretStore — NOT a ClusterSecretStore.
#
# Design rationale (see also external-secrets/external-secrets PR #6141):
#   - ClusterSecretStore + wildcard credentials is an anti-pattern: a
#     compromised ESO instance could read secrets belonging to any tenant.
#   - This SecretStore is scoped to a single namespace and its credentials
#     (vault.token) must be restricted to kv/data/deployments/<cluster-id>/*
#     via an OpenBao policy.
#   - When the hub generates an ExternalSecret for a new deployment it
#     references this store by name, keeping the secret path within the
#     allowed policy boundary.
#
# Post-Sprint 3: replace tokenSecretRef with a Kubernetes auth or AppRole
# auth block once the handshake issues per-cluster credentials.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  namespace: {{ include "saidkick-agent.secretStoreNamespace" . }}
  labels:
    {{- include "saidkick-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-store
spec:
  provider:
    vault:
      server: {{ required "vault.addr is required for SecretStore" .Values.vault.addr | quote }}
      path: {{ .Values.vault.mount | quote }}
      version: "v2"
      {{- if .Values.vault.caBundle }}
      caBundle: {{ .Values.vault.caBundle | b64enc | quote }}
      {{- end }}
      auth:
        # Token auth — will be replaced with AppRole / Kubernetes auth in a
        # future release once the handshake issues per-cluster credentials.
        tokenSecretRef:
          name: saidkick-vault-credentials
          namespace: {{ include "saidkick-agent.secretStoreNamespace" . }}
          key: token
{{- end }}
