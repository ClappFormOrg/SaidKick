{{- if .Values.webapp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "saidkick-hub.fullname" . }}-webapp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "saidkick-hub.webapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webapp.service.type | quote }}
  selector:
    {{- include "saidkick-hub.webapp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.webapp.service.port }}
      targetPort: {{ .Values.webapp.service.targetPort }}
      protocol: TCP
{{- end }}
