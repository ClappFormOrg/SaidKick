{{- if not .Values.api.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "saidkick-hub.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "saidkick-hub.api.labels" . | nindent 4 }}
  annotations:
    # Prevent accidental deletion with Helm uninstall --purge.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  AUTH_SESSION_SECRET: {{ required "api.secrets.authSessionSecret is required" .Values.api.secrets.authSessionSecret | quote }}
  AUTH_SECRET_ENCRYPTION_KEY: {{ .Values.api.secrets.authSecretEncryptionKey | quote }}
  CLUSTER_JOIN_SECRET: {{ required "api.secrets.clusterJoinSecret is required" .Values.api.secrets.clusterJoinSecret | quote }}
  DATABASE_URL: {{ required "api.secrets.databaseUrl is required" .Values.api.secrets.databaseUrl | quote }}
  {{- if .Values.api.secrets.auditDatabaseUrl }}
  AUDIT_DATABASE_URL: {{ .Values.api.secrets.auditDatabaseUrl | quote }}
  {{- end }}
  VAULT_ADDR: {{ .Values.api.secrets.vaultAddr | quote }}
  VAULT_TOKEN: {{ .Values.api.secrets.vaultToken | quote }}
  {{- if .Values.api.secrets.githubAppId }}
  GITHUB_APP_ID: {{ .Values.api.secrets.githubAppId | quote }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.api.secrets.githubAppPrivateKey | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.api.secrets.githubWebhookSecret | quote }}
  {{- end }}
{{- end }}
