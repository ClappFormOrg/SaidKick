{{- if .Values.webapp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "saidkick-hub.fullname" . }}-webapp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "saidkick-hub.webapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webapp.replicaCount }}
  selector:
    matchLabels:
      {{- include "saidkick-hub.webapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.webapp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "saidkick-hub.webapp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "saidkick-hub.serviceAccountName" . | quote }}
      securityContext:
        {{- toYaml .Values.webapp.podSecurityContext | nindent 8 }}
      containers:
        - name: webapp
          securityContext:
            {{- toYaml .Values.webapp.securityContext | nindent 12 }}
          image: {{ include "saidkick-hub.webapp.image" . | quote }}
          imagePullPolicy: {{ .Values.webapp.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NUXT_PUBLIC_API_BASE
              value: {{ .Values.webapp.config.apiBase | quote }}
            # Server-side API origin: the brand palette fetched during SSR
            # and the /branding/logo proxy. Defaults to the API Service.
            - name: API_BASE_INTERNAL_URL
              value: {{ .Values.webapp.config.apiBaseInternal | default (printf "http://%s-api.%s.svc:%v" (include "saidkick-hub.fullname" .) .Release.Namespace .Values.api.service.port) | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.webapp.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nuxt-cache
              mountPath: /.nuxt
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nuxt-cache
          emptyDir: {}
      {{- with .Values.webapp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webapp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webapp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
